[package]
name = "redis-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
redis = "1.7"
indicatif = "0.18"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"

[profile.release]
strip = true


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow" # u64 -> f64 for estimates is intended
cast_possible_wrap = "allow"
too_many_lines = "allow"
